version: '3.8'

services:
  blocky-maze-app:
    build: .
    image: blocky-maze-app
    container_name: blocky-maze-app
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0.0}
      - LIBGL_ALWAYS_SOFTWARE=1
    ports:
      - "6080:6080"
    volumes:
      - .:/app
      - /app/blocky_game/target
      - /app/blocky_momot/target
      - /app/blocky_model/target
      - /tmp/.X11-unix:/tmp/.X11-unix
